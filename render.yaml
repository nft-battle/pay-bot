services:
  - type: web
    name: pay-bot
    runtime: python
    plan: free
    pythonVersion: 3.12.8
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m bot
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: CRYPTO_PAY_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: CRYPTO_ASSET
        value: USDT
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false